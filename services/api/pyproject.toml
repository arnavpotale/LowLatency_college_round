[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "second-opinion-api"
version = "0.1.0"
description = "Second Opinion — AI Answer Verification Platform Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Second Opinion Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "python-multipart>=0.0.9",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
ai = [
    "pymupdf>=1.24.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
