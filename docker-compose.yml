version: '3.8'

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: second-opinion-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=sqlite:///./second_opinion.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - ENABLE_MOCK_VERIFICATION=true
    volumes:
      - ./services/api/uploads:/app/uploads
      - ./services/api:/app
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: second-opinion-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    restart: unless-stopped

  # Optional PostgreSQL instance for production-like persistence
  postgres:
    image: postgres:16-alpine
    container_name: second-opinion-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: second_opinion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - full-stack

volumes:
  postgres_data:
